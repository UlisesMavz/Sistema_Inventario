    <div class="divider"></div>

    <!-- Login form panel -->
    <div class="login-panel">
      <div class="login-box">

        <!-- Brand -->
        <div class="brand">
          <svg class="brand-icon" viewBox="0 0 52 60" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M26,58 Q25,46 27,38 Q29,30 26,20" stroke="#1a1410" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M26,42 Q14,38 8,28 Q4,20 14,17 Q22,15 25,30Z" fill="none" stroke="#1a1410" stroke-width="1"/>
            <path d="M26,42 Q38,37 44,27 Q48,19 38,16 Q30,14 27,29Z" fill="none" stroke="#1a1410" stroke-width="1"/>
            <circle cx="26" cy="14" r="2" fill="#1a1410"/>
            <ellipse cx="26" cy="7" rx="2" ry="5" fill="none" stroke="#1a1410" stroke-width="0.8"/>
            <ellipse cx="26" cy="21" rx="2" ry="5" fill="none" stroke="#1a1410" stroke-width="0.8" transform="rotate(180 26 14)"/>
            <ellipse cx="19" cy="14" rx="2" ry="5" fill="none" stroke="#1a1410" stroke-width="0.8" transform="rotate(-90 26 14)"/>

            <ellipse cx="21" cy="19" rx="2" ry="5" fill="none" stroke="#1a1410" stroke-width="0.8" transform="rotate(-135 26 14)"/>
            <ellipse cx="31" cy="19" rx="2" ry="5" fill="none" stroke="#1a1410" stroke-width="0.8" transform="rotate(135 26 14)"/>
          </svg>
          <div class="brand-text">
            <span class="brand-name">HA&amp;KU</span>
            <span class="brand-sub">Sistema de Inventario</span>
          </div>
        </div>

        <!-- Heading -->
        <div class="login-heading">
          <h1>Bienvenido</h1>
        </div>
        <p class="login-subtitle">Ingresa tus credenciales para continuar</p>

        <!-- Decorative divider -->
        <div class="deco-line">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="8" r="2" fill="#6b4f35"/>
            <path d="M8,2 Q7,5 8,8" stroke="#6b4f35" stroke-width="0.8"/>
            <path d="M8,14 Q9,11 8,8" stroke="#6b4f35" stroke-width="0.8"/>
            <path d="M2,8 Q5,9 8,8" stroke="#6b4f35" stroke-width="0.8"/>
            <path d="M14,8 Q11,7 8,8" stroke="#6b4f35" stroke-width="0.8"/>
          </svg>
        </div>

        <!-- Form -->
        <form id="loginForm">
          <div class="form-group">
            <label for="username">Usuario</label>
            <div class="input-wrap">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <circle cx="8" cy="5" r="3" stroke="#1a1410" stroke-width="1.2"/>
                <path d="M2,14 C2,11 4.7,9 8,9 C11.3,9 14,11 14,14" stroke="#1a1410" stroke-width="1.2" stroke-linecap="round"/>
              </svg>
              <input type="text" id="username" name="username" placeholder="Ingrese su usuario" required autocomplete="username">
            </div>
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <div class="input-wrap">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <rect x="3" y="7" width="10" height="8" rx="1.5" stroke="#1a1410" stroke-width="1.2"/>
                <path d="M5,7 L5,4.5 C5,2.6 11,2.6 11,4.5 L11,7" stroke="#1a1410" stroke-width="1.2" stroke-linecap="round"/>
                <circle cx="8" cy="11" r="1.2" fill="#1a1410"/>
              </svg>
              <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" required autocomplete="current-password">
            </div>
          </div>

          <div id="errorMessage" class="error-message"></div>

          <button type="submit" class="btn-submit" id="loginBtn">
            <span class="btn-text">Iniciar Sesión</span>
            <span class="btn-loader" style="display: none;">
              <span class="loader" id="loader" style="display: block;"></span>
            </span>
          </button>
        </form>

        <!-- Footer -->
        <div class="login-footer">
          <p>HA&amp;KU · Gestión de Inventario · © 2026</p>
        </div>

      </div>
