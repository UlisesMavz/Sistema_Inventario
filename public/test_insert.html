<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Inserción - Debug</title>
    <link rel="stylesheet" href="css/test_insert.css">
</head>
<body>
    <h1>🧪 Test de Inserción de Productos</h1>
    <p>Este formulario muestra todos los detalles de la petición y respuesta</p>
    
    <form id="testForm">
        <div class="form-group">
            <label>Código:</label>
            <input type="number" id="codigo" value="200" required>
        </div>
        
        <div class="form-group">
            <label>Nombre:</label>
            <input type="text" id="nombre" value="Producto Test" required>
        </div>
        
        <div class="form-group">
            <label>Precio:</label>
            <input type="number" step="0.01" id="precio" value="100.00" required>
        </div>
        
        <div class="form-group">
            <label>Tipo de Inserción:</label>
            <select id="tipo">
                <option value="inicio">Al Inicio</option>
                <option value="final">Al Final</option>
                <option value="posicion">En Posición</option>
            </select>
        </div>
        
        <button type="submit">Insertar Producto</button>
    </form>
    
    <div id="resultado"></div>
    
    <script>
        document.getElementById('testForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const resultadoDiv = document.getElementById('resultado');
            resultadoDiv.style.display = 'block';
            resultadoDiv.className = '';
            resultadoDiv.innerHTML = '<strong>⏳ Procesando...</strong>';
            
            const datos = {
                codigo: parseInt(document.getElementById('codigo').value),
                nombre: document.getElementById('nombre').value,
                precio: parseFloat(document.getElementById('precio').value),
                tipo: document.getElementById('tipo').value
            };
            
            console.log('📤 Enviando datos:', datos);
            
            try {
                const response = await fetch('../api/productos.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify(datos)
                });
                
                console.log('📥 Response status:', response.status);
                console.log('📥 Response headers:', [...response.headers.entries()]);
                
                const responseText = await response.text();
                console.log('📥 Response text:', responseText);
                
                let data;
                try {
                    data = JSON.parse(responseText);
                } catch (parseError) {
                    console.error('❌ Error parseando JSON:', parseError);
                    resultadoDiv.className = 'error';
                    resultadoDiv.innerHTML = `
                        <strong>❌ Error: Respuesta no es JSON válido</strong><br><br>
                        <strong>Status HTTP:</strong> ${response.status}<br><br>
                        <strong>Respuesta del servidor:</strong><br>
                        <pre>${responseText}</pre>
                    `;
                    return;
                }
                
                console.log('📥 Datos parseados:', data);
                
                if (data.exito) {
                    resultadoDiv.className = 'success';
                    resultadoDiv.innerHTML = `
                        <strong>✅ ${data.mensaje}</strong><br><br>
                        <strong>Datos enviados:</strong><br>
                        <pre>${JSON.stringify(datos, null, 2)}</pre>
                        <strong>Respuesta completa:</strong><br>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultadoDiv.className = 'error';
                    resultadoDiv.innerHTML = `
                        <strong>❌ Error: ${data.mensaje}</strong><br><br>
                        <strong>Datos enviados:</strong><br>
                        <pre>${JSON.stringify(datos, null, 2)}</pre>
                        <strong>Respuesta completa:</strong><br>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
                
            } catch (error) {
                console.error('❌ Error en la petición:', error);
                resultadoDiv.className = 'error';
                resultadoDiv.innerHTML = `
                    <strong>❌ Error de red o servidor</strong><br><br>
                    <strong>Error:</strong> ${error.message}<br><br>
                    <strong>Datos que se intentaron enviar:</strong><br>
                    <pre>${JSON.stringify(datos, null, 2)}</pre>
                    <br>
                    <strong>Abre la consola del navegador (F12) para más detalles</strong>
                `;
            }
        });
    </script>
</body>
</html>
